    - region [ref=f10e697]:
      - generic [ref=f10e698]:
        - paragraph [ref=f10e699]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=f10e700]
        - generic [ref=f10e701]:
          - paragraph [ref=f10e702]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=f10e703]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=f10e704]:
      - generic [ref=f10e705]:
        - paragraph [ref=f10e706]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=f10e707]
      - list [ref=f10e708]:
        - listitem [ref=f10e709]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=f10e714]
          - paragraph [ref=f10e715]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=f10e716]:
          - heading "Up to five photos per student" [level=3] [ref=f10e723]
          - paragraph [ref=f10e724]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=f10e725]:
          - heading "Teachers stay in control" [level=3] [ref=f10e731]
          - paragraph [ref=f10e732]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=f10e733]:
          - heading "Access stays with the class" [level=3] [ref=f10e738]
          - paragraph [ref=f10e739]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
