    - region [ref=e367]:
      - generic [ref=e368]:
        - paragraph [ref=e369]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=e370]
        - generic [ref=e371]:
          - paragraph [ref=e372]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=e373]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=e374]:
      - generic [ref=e375]:
        - paragraph [ref=e376]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=e377]
      - list [ref=e378]:
        - listitem [ref=e379]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=e384]
          - paragraph [ref=e385]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=e386]:
          - heading "Up to five photos per student" [level=3] [ref=e393]
          - paragraph [ref=e394]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=e395]:
          - heading "Teachers stay in control" [level=3] [ref=e401]
          - paragraph [ref=e402]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=e403]:
          - heading "Access stays with the class" [level=3] [ref=e408]
          - paragraph [ref=e409]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
