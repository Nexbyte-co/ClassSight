    - region [ref=f13e645]:
      - generic [ref=f13e646]:
        - paragraph [ref=f13e647]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=f13e648]
        - generic [ref=f13e649]:
          - paragraph [ref=f13e650]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=f13e651]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=f13e652]:
      - generic [ref=f13e653]:
        - paragraph [ref=f13e654]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=f13e655]
      - list [ref=f13e656]:
        - listitem [ref=f13e657]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=f13e662]
          - paragraph [ref=f13e663]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=f13e664]:
          - heading "Up to five photos per student" [level=3] [ref=f13e671]
          - paragraph [ref=f13e672]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=f13e673]:
          - heading "Teachers stay in control" [level=3] [ref=f13e679]
          - paragraph [ref=f13e680]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=f13e681]:
          - heading "Access stays with the class" [level=3] [ref=f13e686]
          - paragraph [ref=f13e687]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
