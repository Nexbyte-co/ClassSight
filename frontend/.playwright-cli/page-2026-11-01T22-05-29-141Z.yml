    - region [ref=f1e510]:
      - generic [ref=f1e511]:
        - paragraph [ref=f1e512]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=f1e513]
        - generic [ref=f1e514]:
          - paragraph [ref=f1e515]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=f1e516]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=f1e517]:
      - generic [ref=f1e518]:
        - paragraph [ref=f1e519]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=f1e520]
      - list [ref=f1e521]:
        - listitem [ref=f1e522]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=f1e527]
          - paragraph [ref=f1e528]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=f1e529]:
          - heading "Up to five photos per student" [level=3] [ref=f1e536]
          - paragraph [ref=f1e537]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=f1e538]:
          - heading "Teachers stay in control" [level=3] [ref=f1e544]
          - paragraph [ref=f1e545]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=f1e546]:
          - heading "Access stays with the class" [level=3] [ref=f1e551]
          - paragraph [ref=f1e552]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
