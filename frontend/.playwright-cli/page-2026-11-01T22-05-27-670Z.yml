    - region [ref=e510]:
      - generic [ref=e511]:
        - paragraph [ref=e512]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=e513]
        - generic [ref=e514]:
          - paragraph [ref=e515]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=e516]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=e517]:
      - generic [ref=e518]:
        - paragraph [ref=e519]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=e520]
      - list [ref=e521]:
        - listitem [ref=e522]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=e527]
          - paragraph [ref=e528]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=e529]:
          - heading "Up to five photos per student" [level=3] [ref=e536]
          - paragraph [ref=e537]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=e538]:
          - heading "Teachers stay in control" [level=3] [ref=e544]
          - paragraph [ref=e545]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=e546]:
          - heading "Access stays with the class" [level=3] [ref=e551]
          - paragraph [ref=e552]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
