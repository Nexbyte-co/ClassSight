    - region [ref=e350]:
      - generic [ref=e351]:
        - paragraph [ref=e352]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=e353]
        - generic [ref=e354]:
          - paragraph [ref=e355]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=e356]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=e357]:
      - generic [ref=e358]:
        - paragraph [ref=e359]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=e360]
      - list [ref=e361]:
        - listitem [ref=e362]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=e367]
          - paragraph [ref=e368]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=e369]:
          - heading "Up to five photos per student" [level=3] [ref=e376]
          - paragraph [ref=e377]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=e378]:
          - heading "Teachers stay in control" [level=3] [ref=e384]
          - paragraph [ref=e385]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=e386]:
          - heading "Access stays with the class" [level=3] [ref=e391]
          - paragraph [ref=e392]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
