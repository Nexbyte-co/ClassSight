    - region [ref=e519]:
      - generic [ref=e520]:
        - paragraph [ref=e521]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=e522]
        - generic [ref=e523]:
          - paragraph [ref=e524]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=e525]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=e526]:
      - generic [ref=e527]:
        - paragraph [ref=e528]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=e529]
      - list [ref=e530]:
        - listitem [ref=e531]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=e536]
          - paragraph [ref=e537]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=e538]:
          - heading "Up to five photos per student" [level=3] [ref=e545]
          - paragraph [ref=e546]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=e547]:
          - heading "Teachers stay in control" [level=3] [ref=e553]
          - paragraph [ref=e554]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=e555]:
          - heading "Access stays with the class" [level=3] [ref=e560]
          - paragraph [ref=e561]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
    - region [ref=e562]:
