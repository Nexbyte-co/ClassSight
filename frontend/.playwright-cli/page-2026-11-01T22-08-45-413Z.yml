    - region [ref=f6e519]:
      - generic [ref=f6e520]:
        - paragraph [ref=f6e521]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=f6e522]
        - generic [ref=f6e523]:
          - paragraph [ref=f6e524]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=f6e525]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=f6e526]:
      - generic [ref=f6e527]:
        - paragraph [ref=f6e528]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=f6e529]
      - list [ref=f6e530]:
        - listitem [ref=f6e531]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=f6e536]
          - paragraph [ref=f6e537]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=f6e538]:
          - heading "Up to five photos per student" [level=3] [ref=f6e545]
          - paragraph [ref=f6e546]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=f6e547]:
          - heading "Teachers stay in control" [level=3] [ref=f6e553]
          - paragraph [ref=f6e554]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=f6e555]:
          - heading "Access stays with the class" [level=3] [ref=f6e560]
          - paragraph [ref=f6e561]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
    - region [ref=f6e562]:
