    - region [ref=f8e528]:
      - generic [ref=f8e529]:
        - paragraph [ref=f8e530]: About ClassSight
        - heading "Less time on the register, more time teaching." [level=2] [ref=f8e531]
        - generic [ref=f8e532]:
          - paragraph [ref=f8e533]: Calling names and passing sheets eats into every class. ClassSight turns one classroom photo into a draft register, so teachers spend their time on the few students who need a second look rather than on everyone.
          - paragraph [ref=f8e534]: "The aim is attendance that is quick to take and easy to trust: careful about uncertain matches, clear about what was decided, and always confirmed by the person responsible for the class."
    - region [ref=f8e535]:
      - generic [ref=f8e536]:
        - paragraph [ref=f8e537]: Built to be trusted
        - heading "Careful by design." [level=2] [ref=f8e538]
      - list [ref=f8e539]:
        - listitem [ref=f8e540]:
          - heading "A wrong match is treated as worse than a miss" [level=3] [ref=f8e545]
          - paragraph [ref=f8e546]: A face is only matched when it clearly beats every other student. Anything close is left for the teacher.
        - listitem [ref=f8e547]:
          - heading "Up to five photos per student" [level=3] [ref=f8e554]
          - paragraph [ref=f8e555]: Enrollment photos are combined into one face profile, and re-enrolling replaces the old one.
        - listitem [ref=f8e556]:
          - heading "Teachers stay in control" [level=3] [ref=f8e562]
          - paragraph [ref=f8e563]: Nothing is saved until the teacher has resolved the unclear faces and confirmed the record.
        - listitem [ref=f8e564]:
          - heading "Access stays with the class" [level=3] [ref=f8e569]
          - paragraph [ref=f8e570]: Teachers only see their own classrooms, and classroom photos are kept in private storage.
