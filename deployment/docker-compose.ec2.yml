# EC2 overrides, layered on docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --build
# with COMPOSE_PROFILES=app in deployment/.env (local S3 is not started).
#
# Photos go to real S3 using the instance's IAM role, so no AWS keys are set.
# Browsers call the API directly (VITE_API_BASE_URL), so the security group
# must allow 80 (frontend) and 8000 (API), plus 22 from your IP only.
# Postgres is bound to the instance itself and never exposed.

services:

  postgres:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:5432:5432"

  backend:
    restart: unless-stopped
    environment:
      S3_ENDPOINT_URL: ""
      S3_PUBLIC_ENDPOINT_URL: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""

  frontend:
    restart: unless-stopped
